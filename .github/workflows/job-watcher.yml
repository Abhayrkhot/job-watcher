name: Job watcher

on:
  schedule:
    # Offset from the top of the hour, when scheduled Actions traffic is highest.
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: Send a delivery test instead of polling jobs
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: job-watcher-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5

      - name: Restore persistent state
        shell: bash
        run: |
          mkdir -p state
          if git fetch origin job-watcher-state && \
             git show FETCH_HEAD:state.tar.gz > /tmp/job-watcher-state.tar.gz; then
            tar -xzf /tmp/job-watcher-state.tar.gz -C state
          else
            cp bootstrap/ats_boards.json state/ats_boards.json
          fi

      - name: Validate required secrets
        env:
          JOB_WATCHER_TO: ${{ secrets.JOB_WATCHER_TO }}
          JOB_WATCHER_RESEND_API_KEY: ${{ secrets.JOB_WATCHER_RESEND_API_KEY }}
          JOB_WATCHER_ADZUNA_APP_ID: ${{ secrets.JOB_WATCHER_ADZUNA_APP_ID }}
          JOB_WATCHER_ADZUNA_APP_KEY: ${{ secrets.JOB_WATCHER_ADZUNA_APP_KEY }}
          JOB_WATCHER_JOOBLE_API_KEY: ${{ secrets.JOB_WATCHER_JOOBLE_API_KEY }}
        shell: bash
        run: |
          test -n "$JOB_WATCHER_TO"
          test -n "$JOB_WATCHER_RESEND_API_KEY"

      - name: Poll approved job APIs
        env:
          JOB_WATCHER_TO: ${{ secrets.JOB_WATCHER_TO }}
          JOB_WATCHER_RESEND_API_KEY: ${{ secrets.JOB_WATCHER_RESEND_API_KEY }}
        shell: bash
        run: |
          if [[ "${{ inputs.test_email }}" == "true" ]]; then
            python3 job_watcher.py --test-email
          else
            python3 job_watcher.py
          fi

      - name: Persist state
        shell: bash
        run: |
          tar -czf /tmp/state.tar.gz -C state ats_boards.json jobs.sqlite3
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan job-watcher-state-next
          git rm -rf .
          cp /tmp/state.tar.gz state.tar.gz
          git add -f state.tar.gz
          git commit -m "Update watcher state"
          git push --force origin HEAD:job-watcher-state
